
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Busticaria, tienda online de tecnología, ropa y hogar.">
    <title>Busticaria - Inicio</title>

</head>
<body>
    <header id="navbar"></header>

    <main>
        <section class="hero-busticaria">
            <div class="container">
                <h1>Bienvenidos a Busticaria</h1>
                <p>Tu tienda online de tecnología, ropa y hogar.</p>
                <a href="#catalogo" class="btn btn-busticaria">Ver productos</a>

        </section>

        <section class="container pt-5">
            <h2 class="mb-4">Categorías</h2>
            <div class="row g-3">
                <div class="col-md-4">

            <h3 class="h4 mt-4 mb-3">Hogar</h3>
